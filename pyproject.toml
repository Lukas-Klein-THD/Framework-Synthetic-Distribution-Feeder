[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gridgen"
version = "0.1.0"
description = "A pluggable framework for generating and evaluating synthetic distribution networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
# Plugins bring their own modelling stack; the core deliberately does not.
torch = ["torch>=2.0"]
# everything the bundled plugins, evaluation and figure scripts import
plugins = ["torch>=2.0", "networkx>=3.0", "matplotlib>=3.7", "dss-python>=0.15"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["gridgen*", "plugins*"]

[tool.setuptools.package-data]
"plugins.distribution" = ["splits/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# import gridgen and plugins from the repository root, also with plain `pytest`
pythonpath = ["."]
